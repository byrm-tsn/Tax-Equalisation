[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-equalisation"
version = "0.1.0"
description = "Tax-equalisation cost estimator: calculation engine, immigration guidance and Django web app."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pytest-django>=4.9",
    "django-stubs>=5.2",
]
web = [
    "django>=5.2,<5.3",
    "django-ninja>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teq_engine = ["py.typed", "ratesets/data/gb/*.yaml", "ratesets/data/tr/*.yaml"]
teq_guidance = ["py.typed", "data/*.json"]
teq_web = ["web/templates/web/*.html", "web/static/web/*.css"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Python only: code samples in Markdown docs are illustrative and keep their alignment.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "C4",   # comprehensions
    "PT",   # pytest style
    "RUF",  # ruff-specific
    "TID",  # tidy imports (banned APIs below)
    "DTZ",  # naive datetime calls
]
ignore = [
    "RUF001",  # ambiguous unicode in strings (the pound sign is intentional)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "The engine has no clock: pass dates in explicitly."
"datetime.datetime.today".msg = "The engine has no clock: pass dates in explicitly."
"datetime.date.today".msg = "The engine has no clock: pass dates in explicitly."
"time.time".msg = "The engine has no clock: pass dates in explicitly."

[tool.ruff.lint.isort]
known-first-party = ["teq_engine", "teq_guidance", "teq_web"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["teq_engine", "teq_engine.*"]
strict = true
disallow_any_explicit = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
DJANGO_SETTINGS_MODULE = "teq_web.settings.test"
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
